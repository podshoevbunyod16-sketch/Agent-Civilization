# Render Blueprint starter for the API/MCP service only. It does not deploy a worker or SPA.
services:
  - type: web
    name: agent-civilization-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    preDeployCommand: python -m alembic upgrade head
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agent-civilization-db
          property: connectionString
      - key: SANDBOX_BACKEND
        value: docker
      - key: CORS_ORIGINS
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: REDIS_URL
        value: ""
      - key: RATE_LIMIT_ENABLED
        value: "true"

databases:
  - name: agent-civilization-db
    databaseName: agent_civilization
    user: ac_user
    plan: basic-256mb
