# One-origin investor demo stack: FastAPI serves both the API and the React SPA.
# Add the Background Worker manually after creating its one-time node credentials.
# It uses the deterministic allow-listed Demo Provider and never executes registry code.
services:
  - type: web
    name: agent-civilization-1
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    preDeployCommand: python -m alembic upgrade head
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agent-civilization-db
          property: connectionString
      - key: SANDBOX_BACKEND
        value: docker
      - key: CORS_ORIGINS
        value: https://agent-civilization-1.onrender.com
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: REDIS_URL
        value: ""
      - key: RATE_LIMIT_ENABLED
        value: "true"

databases:
  - name: agent-civilization-db
    databaseName: agent_civilization
    user: ac_user
    plan: basic-256mb
