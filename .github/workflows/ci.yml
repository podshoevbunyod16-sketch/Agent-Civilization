name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests + migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pgserver fakeredis

      - name: Lint (ruff)
        run: ruff check app tests scripts

      - name: Tests (real PostgreSQL via pgserver, Alembic migrations)
        env:
          SECRET_KEY: ci-secret-key-long-enough-for-hs256-32chars
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=60

      - name: Security tests (auth, authorization, SSRF, finance)
        env:
          SECRET_KEY: ci-secret-key-long-enough-for-hs256-32chars
        run: |
          pytest tests/api/test_auth_security.py tests/api/test_security_fixes.py \
                 tests/unit/test_secrets.py tests/unit/test_net_guard.py \
                 tests/api/test_financial_invariants.py tests/api/test_backup_restore.py
          # Отдельный прогон: отказ старта в небезопасной production-конфигурации
          python - <<'PY'
          from app.core.config import Settings
          base = dict(
              environment="production", debug=False, secret_key="x" * 40,
              internal_service_token="t" * 20, redis_url="redis://localhost:6379/0",
              cors_origins=["https://example.com"], public_base_url="https://example.com",
              secret_encryption_keys="1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=",
              sandbox_backend="docker",
          )
          Settings(**base).validate_for_runtime()
          for patch in ({"debug": True}, {"secret_key": "change-me"},
                        {"cors_origins": ["*"]}, {"sandbox_allow_network": True}):
              try:
                  Settings(**{**base, **patch}).validate_for_runtime()
              except RuntimeError:
                  continue
              raise SystemExit(f"небезопасная конфигурация не отклонена: {patch}")
          print("production-конфигурация валидируется корректно")
          PY

      - name: Alembic migration check (single head)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres@/postgres?host=/tmp
        run: |
          python - <<'PY'
          from app.db.base import Base
          import app.db.models  # noqa
          print("tables:", len(Base.metadata.tables))
          assert len(Base.metadata.tables) >= 13
          PY
          alembic heads

      - name: OpenAPI schema is generated
        run: python -c "from app.main import app; s=app.openapi(); assert len(s['paths']) > 40; print(len(s['paths']), 'paths')"

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # ── Этап 10, I: сканирование безопасности ───────────────────────────
  # Критичные находки блокируют релиз. Правила задокументированы в
  # docs/SECURITY.md («Сканирование в CI»), а не «где-то в настройках».
  security:
    name: Security scans (SAST, deps, secrets, container)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scanners
        # Версии фиксированы, чтобы результат не «плыл» между прогонами
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.7.10 pip-audit==2.7.3

      - name: SAST (bandit) — только HIGH блокирует
        run: |
          bandit -r app -ll -ii -f json -o bandit.json || status=$?
          python - <<'PY'
          import json, sys
          report = json.load(open("bandit.json"))
          high = [
              item for item in report.get("results", [])
              if item.get("issue_severity") == "HIGH"
          ]
          for item in high:
              print(f"HIGH {item['filename']}:{item['line_number']} {item['test_id']} {item['issue_text']}")
          if high:
              print(f"Критичных находок: {len(high)} — релиз блокируется")
              sys.exit(1)
          print("HIGH-находок нет")
          PY

      - name: Dependency audit (pip-audit) — уязвимости блокируют
        run: |
          pip install -e . >/dev/null
          pip-audit --progress-spinner off --strict || {
            echo "::error::Найдены уязвимые зависимости (pip-audit)";
            exit 1;
          }

      - name: Secret scan (grep по репозиторию)
        # Полноценный скан (gitleaks) требует лицензии/бинаря; здесь —
        # быстрый детерминированный набор шаблонов, который ловит то, что
        # чаще всего утекает: приватные ключи, боевые токены, AWS/GitHub.
        run: |
          cd "$GITHUB_WORKSPACE"
          python - <<'PY'
          import re, subprocess, sys
          patterns = {
              "private key": r"-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----",
              "aws key": r"AKIA[0-9A-Z]{16}",
              "github token": r"gh[pousr]_[A-Za-z0-9]{36,}",
              "slack token": r"xox[baprs]-[0-9a-zA-Z-]{10,}",
              "openai key": r"sk-[A-Za-z0-9]{32,}",
          }
          allowed = ("tests/", "docs/", ".github/workflows/ci.yml", "README.md")
          files = subprocess.run(
              ["git", "ls-files"], capture_output=True, text=True, check=True
          ).stdout.split()
          hits = []
          for name in files:
              if any(name.startswith(prefix) for prefix in allowed):
                  continue
              if not name.endswith((".py", ".ts", ".tsx", ".yml", ".yaml", ".env", ".sh", ".json", ".md")):
                  continue
              try:
                  text = open(name, encoding="utf-8", errors="ignore").read()
              except OSError:
                  continue
              for label, pattern in patterns.items():
                  for match in re.finditer(pattern, text):
                      hits.append(f"{name}: {label}")
          for hit in hits:
              print(hit)
          if hits:
              print(f"Найдено возможных секретов: {len(hits)}")
              sys.exit(1)
          print("Секретов в репозитории не найдено")
          PY

      - name: Container scan (trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: agent-civilization-api:ci
          format: table
          exit-code: "1"
          # Блокируем только CRITICAL с доступным исправлением: иначе CI
          # краснеет от уязвимостей базового образа, которые нельзя закрыть
          # в этом репозитории.
          severity: CRITICAL
          ignore-unfixed: true

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agent-civilization-api:ci ./backend
