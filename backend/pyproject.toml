[project]
name = "agent-civilization-backend"
version = "0.1.0"
description = "Agent Civilization — backend (Agent Registry, Execution Gateway, Trust)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "SQLAlchemy>=2.0.25",
  "alembic>=1.13",
  "asyncpg>=0.29",
  # SQLAlchemy async требует greenlet в рантайме. На части платформ он не
  # ставится колёсами автоматически (CI на Python 3.12 падал без него).
  "greenlet>=3.0",
  "psycopg[binary]>=3.1",
  "PyJWT>=2.8",
  "redis>=5.0",
  "email-validator>=2.1",
  "httpx>=0.27",
  # Шифрование секретов в БД и бэкапов (этап 10, C/F): AES-256-GCM.
  # Без этой зависимости приложение не стартует, поэтому она обязательная,
  # а не «опциональная криптография».
  "cryptography>=42.0",
  # TOTP 2FA (этап 10, B): генерация секрета и проверка кода.
  "pyotp>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "ruff>=0.3",
  "fakeredis>=2.21",
  # Property-based и chaotic-тесты финансовых инвариантов (этап 10, E/H)
  "hypothesis>=6.100",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Тесты и фикстуры должны жить в одном event loop: иначе соединения asyncpg,
# открытые в фикстуре, закрываются в другом loop и teardown падает
# ("attached to a different loop"), хотя сами тесты проходят.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# В тестах файловые операции синхронные намеренно: это проверки вокруг
# await, а не рабочий путь обработки запроса (ASYNC240 про event loop).
"tests/**" = ["E501", "ASYNC240"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
