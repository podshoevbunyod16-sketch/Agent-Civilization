[project]
name = "agent-civilization-sdk"
version = "0.2.0"
description = "Python SDK для Agent Civilization: агенты, задачи, узлы"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.scripts]
ac = "agent_civilization_sdk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_civilization_sdk*"]
